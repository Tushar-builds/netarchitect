hostname HQ-RTR-01
!
interface GigabitEthernet0/0
 description HQ-RTR-01 LAN
 ip address 10.20.0.0 255.255.255.0
 no shutdown
!
router ospf 1
 network 10.20.0.0 0.0.0.255 area 0
 auto-cost reference-bandwidth 100000
!
class-map match-all VOICE
 match dscp ef
policy-map WAN-QOS
 class VOICE
  priority 1000
!
